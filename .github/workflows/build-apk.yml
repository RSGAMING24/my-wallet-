name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          elif [ -f "./android/gradlew" ]; then
            cd android
            ./gradlew --no-daemon clean assembleDebug
          elif [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            gradle --no-daemon clean assembleDebug
          elif [ -f "./android/settings.gradle" ] || [ -f "./android/settings.gradle.kts" ]; then
            cd android
            gradle --no-daemon clean assembleDebug
          else
            echo "No Android/Gradle project found."
            echo "This repository needs gradlew, settings.gradle, or an android/ folder."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
