name: Build APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository-তে কোনো ZIP ফাইল পাওয়া যায়নি।"
            exit 1
          fi

          echo "ZIP পাওয়া গেছে: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          set -e

          GRADLEW_FILE=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_FILE" ]; then
            echo "ERROR: ZIP-এর ভিতরে gradlew ফাইল পাওয়া যায়নি।"
            echo "এটি সঠিক Android Studio Gradle Project নয়, অথবা ZIP-এর ভিতরে আরেকটি ZIP আছে।"
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_FILE")

          echo "Android Project পাওয়া গেছে: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWallet-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWallet-APK
          path: '**/build/outputs/apk/debug/*.apk'
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWallet-APK
          path: '**/build/outputs/apk/debug/*.apk'
